<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="세 장의 팩을 열어 TEAM 5 멤버를 만나는 인터랙티브 팀 소개" />
    <meta name="theme-color" content="#05070b" />
    <title>TEAM 5 | OPEN THE SQUAD</title>
    <link rel="preload" href="assets/game/stadium-day-v1.png" as="image" />
    <link rel="preload" href="assets/game/member-pack-v1.png" as="image" />
    <link rel="preload" href="assets/cards/taewoong-card-cutout-v2.png?v=alpha-20260911" as="image" />
    <link rel="preload" href="assets/cards/youngkwang-card-cutout-v2.png?v=alpha-20260911" as="image" />
    <link rel="preload" href="assets/cards/yejin-card-cutout-v2.png?v=alpha-20260911" as="image" />
    <link rel="stylesheet" href="styles.css?v=pack-reveal-20260911l" />
  </head>
  <body>
    <main id="experience" class="experience" data-scene="lobby">
      <div class="arena-backdrop" aria-hidden="true">
        <span class="arena-vignette"></span>
        <span class="ambient-orb ambient-orb-left"></span>
        <span class="ambient-orb ambient-orb-right"></span>
        <span class="grain"></span>
      </div>

      <section id="lobby-view" class="scene scene-lobby" data-view="lobby" aria-label="TEAM 5 멤버 팩">
        <div class="pack-zone">
          <div class="pack-spotlight" aria-hidden="true"></div>
          <div class="pack-rings" aria-hidden="true"><i></i><i></i><i></i></div>
          <button id="open-pack" class="pack-trigger" type="button" aria-label="멤버 팩 열기">
            <span class="pack-aura" aria-hidden="true"></span>
            <img src="assets/game/member-pack-v1.png" alt="TEAM 5 은빛 멤버 팩" />
          </button>
        </div>
      </section>

      <section id="tunnel-view" class="scene scene-tunnel" data-view="tunnel" aria-live="polite" hidden>
        <div class="tunnel" aria-hidden="true">
          <div class="tunnel-ceiling"></div>
          <div class="tunnel-floor"></div>
          <div class="tunnel-frame frame-1"></div>
          <div class="tunnel-frame frame-2"></div>
          <div class="tunnel-frame frame-3"></div>
          <div class="tunnel-frame frame-4"></div>
          <div class="tunnel-exit"></div>
        </div>
        <article id="hint-card" class="hint-card">
          <strong id="hint-title">TEAM 5</strong>
        </article>
        <button id="skip-reveal" class="skip-button" type="button">연출 건너뛰기 <span>→</span></button>
      </section>

      <section id="reveal-view" class="scene scene-reveal" data-view="reveal" aria-label="공개된 팀원 카드" hidden>
        <div class="reveal-lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <button id="back-to-lobby" class="reveal-back" type="button">← 이전으로</button>
        <div class="reveal-composition">
          <div id="reveal-card" class="reveal-card-slot"></div>
        </div>
        <div class="reveal-actions">
          <button id="next-pack" class="primary-action" type="button">다음 팩</button>
        </div>
      </section>

      <section id="collection-view" class="scene scene-collection" data-view="collection" aria-label="공개된 팀원 카드" hidden>
        <button id="restart-pack" class="collection-back" type="button">← 팩 선택</button>
        <div id="collection-cards" class="collection-cards" role="group" aria-label="TEAM 5 팀원 카드"></div>
      </section>

      <div id="white-flash" class="white-flash" aria-hidden="true"></div>
      <p id="announcement" class="sr-only" aria-live="assertive"></p>
    </main>

    <script type="module" src="script.js?v=pack-reveal-20260911k"></script>
  </body>
</html>
